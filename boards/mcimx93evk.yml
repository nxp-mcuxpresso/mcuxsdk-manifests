# Package tailoring: trim devices/ and drivers/ to only what this board needs.
# Derived from device Kconfig.chip IP support variants (via MIR board->device mapping).
devices_filter:
  - i.MX/i.MX93

drivers_filter:
  - cache
  - clock
  - common
  - edma4
  - enet
  - enet_qos
  - flexcan
  - flexio
  - flexspi
  - i3c
  - iomuxc
  - isi
  - lcdifv3
  - lpi2c
  - lpit
  - lpspi
  - lptmr
  - lpuart
  - mcm
  - mipi_dsi_imx
  - mu1
  - otfad
  - pdm
  - power
  - pxp
  - reset
  - rgpio
  - sai
  - sar_adc
  - sema42
  - smartcard
  - spdif
  - tmu_3
  - tpm
  - trdc_1
  - trgmux
  - tstmr
  - usdhc
  - wdog32


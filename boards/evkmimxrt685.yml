# Package tailoring: trim devices/ and drivers/ to only what this board needs.
# Derived from device Kconfig.chip IP support variants (via MIR board->device mapping).
devices_filter:
  - RT/RT600

drivers_filter:
  - acmp
  - cache
  - casper
  - clock
  - common
  - ctimer
  - dmic
  - flexcomm
  - flexspi
  - fmeas
  - hashcrypt
  - i3c
  - iap3
  - inputmux
  - iomuxc
  - lpadc
  - lpc_crc
  - lpc_dma
  - lpc_gpio
  - lpc_iopctl
  - lpc_rtc
  - mrt
  - mu
  - ostimer
  - otfad
  - pint
  - power
  - powerquad
  - puf
  - reset
  - sctimer
  - sema42
  - trng
  - usdhc
  - utick
  - wwdt


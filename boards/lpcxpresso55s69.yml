  - enc
  - flexcomm
  - flexpwm
  - flexspi
  - gint
  - hashcrypt
  - hscmp
  - i3c
  - iap1
  - inputmux
  - iomuxc
  - iped
  - irtc
  - itrc
  - lpadc
  - lpc_crc
  - lpc_dma
  - lpc_freqme
  - lpc_gpio
  - lpc_iocon
